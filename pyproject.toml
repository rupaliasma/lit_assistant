[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litagent"
version = "0.1.0"
description = "Multi-agent literature assistant that answers MRI reconstruction questions with checked PubMed citations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Soumick Chatterjee" }]
keywords = ["LLM", "agents", "PubMed", "MRI reconstruction", "citation checking"]
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
litagent = "litagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["litagent", "conftest", "test_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: talks to NCBI and Europe PMC (set LITAGENT_LIVE_TESTS=1)"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
